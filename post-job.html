<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobFinder — Post a Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="data.js"></script>
    <script defer src="app.js"></script>
</head>
<body data-page="post">
    <a href="#main" class="skip-link">Skip to content</a>
    <header id="site-header"></header>

    <main id="main">
        <section class="page-header">
            <div class="container">
                <span class="eyebrow">BUILD YOUR TEAM</span>
                <h1>Post a Job</h1>
                <p>Create an opportunity and preview it in the job directory.</p>
            </div>
        </section>

        <section class="container section-space">
            <div class="panel form-panel">
                <h2 class="h4">Vacancy Details</h2>
                <p class="muted">
                    All fields are required. Demo vacancies are saved only in this browser.
                    Salary is specified in USD per month.
                </p>

                <form id="post-form" novalidate>
                    <div class="field">
                        <label for="title">Job Title</label>
                        <input id="title" name="title" class="form-control" type="text"
                               maxlength="80" placeholder="Senior Frontend Developer"
                               aria-describedby="title-error" required>
                        <small id="title-error" class="field-error"></small>
                    </div>

                    <div class="field">
                        <label for="company">Company Name</label>
                        <input id="company" name="company" class="form-control" type="text"
                               maxlength="80" placeholder="Your company"
                               aria-describedby="company-error" required>
                        <small id="company-error" class="field-error"></small>
                    </div>

                    <div class="field">
                        <label for="email">Employer Email</label>
                        <input id="email" name="email" class="form-control" type="email"
                               maxlength="120" autocomplete="email"
                               placeholder="hr@example.com" aria-describedby="email-error" required>
                        <small id="email-error" class="field-error"></small>
                    </div>

                    <div class="form-grid">
                        <div class="field">
                            <label for="location">Location</label>
                            <input id="location" name="location" class="form-control" type="text"
                                   maxlength="60" placeholder="Astana"
                                   aria-describedby="location-error" required>
                            <small id="location-error" class="field-error"></small>
                        </div>

                        <div class="field">
                            <label for="category">Category</label>
                            <select id="category" name="category" class="form-select"
                                    aria-describedby="category-error" required>
                                <option value="">Choose a category</option>
                            </select>
                            <small id="category-error" class="field-error"></small>
                        </div>

                        <div class="field">
                            <label for="employmentType">Employment Type</label>
                            <select id="employmentType" name="employmentType" class="form-select"
                                    aria-describedby="employmentType-error" required>
                                <option value="">Choose employment type</option>
                                <option>Full-time</option>
                                <option>Part-time</option>
                                <option>Internship</option>
                            </select>
                            <small id="employmentType-error" class="field-error"></small>
                        </div>

                        <div class="field">
                            <label for="workMode">Work Mode</label>
                            <select id="workMode" name="workMode" class="form-select"
                                    aria-describedby="workMode-error" required>
                                <option value="">Choose work mode</option>
                                <option>Office</option>
                                <option>Hybrid</option>
                                <option>Remote</option>
                            </select>
                            <small id="workMode-error" class="field-error"></small>
                        </div>
                    </div>

                    <div class="field">
                        <label for="salary">Monthly Salary in USD</label>
                        <input id="salary" name="salary" class="form-control" type="number"
                               min="1" max="100000" step="1" placeholder="2500"
                               aria-describedby="salary-error" required>
                        <small id="salary-error" class="field-error"></small>
                    </div>

                    <div class="field">
                        <label for="description">Job Description</label>
                        <textarea id="description" name="description" class="form-control"
                                  rows="6" maxlength="2000"
                                  placeholder="Describe responsibilities, requirements and benefits..."
                                  aria-describedby="description-error description-count" required></textarea>
                        <div class="field-bottom">
                            <small id="description-error" class="field-error"></small>
                            <small id="description-count" class="muted">0 / 2000</small>
                        </div>
                    </div>

                    <button class="btn btn-primary w-100" type="submit">Publish Demo Job</button>

                    <div id="post-success" class="success-message" role="status" hidden>
                        <p id="post-success-text"></p>
                        <a id="view-posted-job" class="btn btn-outline-success" href="jobs.html">
                            View Your Job
                        </a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
</body>
</html>
